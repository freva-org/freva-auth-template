# Account console theme, styled to match the Freva login page.
# Extends Keycloak's React account console (keycloak.v3) and only adds
# branding and colours, so it keeps working across Keycloak upgrades.
parent=keycloak.v3
import=common/keycloak

# The login page is light-only, keep the account console light too.
darkMode=false

title=Freva Account
favIcon=/img/favicon.ico
favIconType=image/x-icon
logo=/img/freva.png

styles=css/account.css
