# DKRZ login theme: the shared base for all DKRZ-hosted services.
# Service themes (e.g. themes/freva) set parent=dkrz and override only the
# brand* / hero* / *Url properties below plus their own logo and favicon.
parent=base
import=common/keycloak

# Stylesheets
styles=css/styles.css

# js files
scripts=js/script.js

# Locale specific properties
locales=en,de,fr,es

# ---------------------------------------------------------------- branding
brandName=DKRZ
brandTitle=DKRZ Login
brandLogo=img/logo.png
brandFavicon=img/favicon.ico
# Show brandLogo above the title on the login and update-password pages
loginShowLogo=true

# Accent colour used for buttons, links and focus rings (DKRZ logo blue).
brandAccent=#005092
brandAccentHover=#003d70
brandAccentSoft=#e5eef5
brandAccentRing=rgba(0, 80, 146, 0.2)

# Text on the photo panel of the login and update-password pages
heroTitle=Deutsches Klimarechenzentrum
heroSubtitle=Partner der Klimaforschung

# Links
supportEmail=support@dkrz.de
termsUrl=https://docs.dkrz.de/doc/getting_started/benutzungsrichtlinien.html
passwordResetUrl=https://luv.dkrz.de/password-reset/
registerUrl=https://luv.dkrz.de/register/

# ------------------------------------------------------- Keycloak classes
kcHtmlClass=login-pf-page
kcBodyClass=login-container
kcLoginClass=form-container
kcContentWrapperClass=image-container
kcFormCardClass=form-group
kcFormGroupClass=form-group
kcInputWrapperClass=input-wrapper
kcInputClass=
kcButtonClass=submit-button
kcButtonPrimaryClass=submit-button
kcButtonSecondaryClass=passkey-button
kcButtonBlockClass=
kcMarginTopClass=
kcInfoAreaClass=image-content

# Messages
loginTitle=Sign In
loginSubtitle=Welcome back
loginIntro=Please log in to access your account
