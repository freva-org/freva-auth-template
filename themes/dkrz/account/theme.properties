# DKRZ account console theme, styled like the DKRZ login theme.
# Extends Keycloak's React account console (keycloak.v3) and only adds
# branding and colours, so it keeps working across Keycloak upgrades.
parent=keycloak.v3
import=common/keycloak

# The login pages are light-only, keep the account console light too.
darkMode=false

title=DKRZ Account
favIcon=/img/favicon.ico
favIconType=image/x-icon
logo=/img/logo.png

styles=css/account.css
